<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#354c3e;color:#fff;font:15px Arial,sans-serif}main{max-width:520px;margin:auto;padding:8px 18px 28px}label{display:block;text-align:left;font-size:13px;font-weight:700;margin:18px 0 8px}input[type=text],textarea{width:100%;border:1px solid #cbd6c9;border-radius:4px;padding:13px 14px;font:inherit;background:#fff;color:#27372f}textarea{min-height:82px;resize:vertical}.choices{display:flex;gap:22px;justify-content:center;margin:12px 0 20px}.choices label{font-size:15px;margin:0;display:flex;align-items:center;gap:8px;cursor:pointer}.choices input{width:18px;height:18px;accent-color:#a78961}button{background:#fffdf8;color:#27372f;border:0;padding:15px 27px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer;margin-top:10px}button:disabled{opacity:.6;cursor:wait}.status{min-height:42px;line-height:1.5;margin:14px 0 0}.status.error{color:#ffd7cb}.status.success{color:#e6f3df}.honeypot{position:absolute;left:-9999px}:focus-visible{outline:3px solid #d6bd9c;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <form id="rsvpForm">
      <label for="guestName">Invited guest or family name *</label>
      <input id="guestName" name="name" type="text" minlength="2" maxlength="100" autocomplete="name" required>
      <label>Will you attend? *</label>
      <div class="choices"><label><input type="radio" name="attendance" value="Yes" required> Joyfully accepts</label><label><input type="radio" name="attendance" value="No" required> Regretfully declines</label></div>
      <label for="message">Message for Kim &amp; Jiselle (optional)</label>
      <textarea id="message" name="message" maxlength="500"></textarea>
      <div class="honeypot" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
      <button id="submitButton" type="submit">Send RSVP</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('rsvpForm');
    const button = document.getElementById('submitButton');
    const status = document.getElementById('status');
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!form.reportValidity()) return;
      button.disabled = true;
      status.className = 'status';
      status.textContent = 'Saving your RSVP…';
      const values = Object.fromEntries(new FormData(form).entries());
      google.script.run
        .withSuccessHandler(function (result) {
          button.disabled = false;
          if (!result || !result.saved) { status.className = 'status error'; status.textContent = 'We could not confirm your RSVP. Please try again.'; return; }
          form.reset();
          status.className = 'status success';
          status.textContent = 'Thank you! Your RSVP was saved.';
        })
        .withFailureHandler(function (error) {
          button.disabled = false;
          status.className = 'status error';
          status.textContent = error && error.message ? error.message : 'Could not save your RSVP. Please try again.';
        })
        .submitRsvp(values);
    });
  </script>
</body>
</html>
